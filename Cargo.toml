[workspace]
resolver = "2"
members = ["crates/vcompare-engine", "crates/vcompare-service", "crates/vcompare-egui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
regex = "1"
libc = "0.2"

