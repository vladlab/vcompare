<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- vcompare: two frames, offset; where they overlap they agree (light),
       and a trace along the bottom shows one frame that doesn't. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262d"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <clipPath id="a"><rect x="76" y="76" width="268" height="176" rx="22"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- frame A (blue), frame B (amber), overlap -->
  <rect x="76" y="76" width="268" height="176" rx="22" fill="#5a8fd4"/>
  <rect x="168" y="136" width="268" height="176" rx="22" fill="#e8b830"/>
  <rect x="168" y="136" width="268" height="176" rx="22" fill="#f4f1e6" clip-path="url(#a)"/>
  <!-- difference trace with one spike -->
  <path d="M84 424 H212 L236 376 L260 424 H428" fill="none" stroke="#f4f1e6" stroke-opacity="0.9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
